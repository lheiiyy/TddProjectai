<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TL Tracker — Sign In</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#1E1D14;--navy-d:#121108;--navy-c:#17160E;
  --gold:#C6D92E;--text:#1A1A2E;--muted:#6B7A90;--white:#FFFFFF;--light:#D7DCC5;
  --border:#D5E3F0;--bg:#F4F7FB;--card:#FFFFFF;--tld:#2E8B3D;--tld-d:#216B2D;--red:#C0392B;
}
body{font-family:Arial,sans-serif;background:var(--navy);color:var(--text);
  min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.lock-card{background:var(--card);border-radius:8px;padding:28px 24px;width:100%;max-width:340px;
  box-shadow:0 12px 32px rgba(0,0,0,.3);text-align:center}
.lock-logo{margin-bottom:12px}
h1{font-size:16px;color:var(--navy);margin-bottom:4px}
.lock-sub{font-size:11px;color:var(--muted);margin-bottom:18px;line-height:1.5}
#lockForm{display:flex;flex-direction:column;gap:10px}
#pinInput{padding:10px 12px;font-size:14px;border:1px solid #cbd5e0;border-radius:5px;
  font-family:Arial;outline:none;text-align:center;letter-spacing:1px}
#pinInput:focus{border-color:var(--tld);box-shadow:0 0 0 2px rgba(46,139,61,.14)}
button{padding:10px;background:var(--tld);color:var(--white);font-size:13px;font-weight:700;
  border:none;border-radius:5px;cursor:pointer;font-family:Arial}
button:hover{background:var(--tld-d)}
.lock-err{margin-top:12px;padding:8px 10px;background:#FDECEA;border:1px solid #f5b7ab;
  border-radius:4px;color:var(--red);font-size:11px;font-weight:700}
.lock-err[hidden]{display:none}
</style>
</head>
<body>

<div class="lock-card">
  <svg class="lock-logo" width="34" height="34" viewBox="0 0 40 40" aria-hidden="true">
    <circle cx="16" cy="14" r="11" fill="#C6D92E"/>
    <circle cx="26" cy="14" r="11" fill="#15140F"/>
    <circle cx="21" cy="24" r="11" fill="#2E8B3D"/>
  </svg>
  <h1>🍕 TL Tracker</h1>
  <div class="lock-sub">Enter the access PIN to continue.</div>
  <form method="POST" action="<?= actionUrl ?>" id="lockForm">
    <input type="password" inputmode="numeric" name="pin" id="pinInput" placeholder="PIN" autocomplete="off" autofocus>
    <button type="submit">Unlock</button>
  </form>
  <div class="lock-err" id="lockErr" hidden>Incorrect PIN — please try again.</div>
</div>

<script>
(function () {
  // Deliberately not remembered anywhere (no localStorage) — a closed tab,
  // a refresh, or a copied link always lands back here. The full TLForm's
  // own PIN screen still remembers a PIN locally, but only for the
  // in-Sheet desktop dialog (showTLForm()), never for this web-app path.
  var failed = <?!= failed ? 'true' : 'false' ?>;
  if (failed) {
    document.getElementById('lockErr').hidden = false;
  }
})();
</script>

</body>
</html>
